# Checks spelling on the lines a pull request adds.
# The repository has pre-existing spelling issues, so only added lines are
# checked (dev_scripts/cspell-changed-lines.sh): touching a file doesn't
# surface its legacy problems, while new issues are still caught.
# cSpell:ignore ACMRTUXB
name: cSpell
run-name: '[cSpell] ${{ github.event.pull_request.title }}'

on:
  pull_request:

jobs:
  spell-check:
    name: Check spelling on changed files
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cspell
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Check for spelling errors in changed files
        run: |
          # Fetch the base branch so we can diff against it.
          git remote set-branches origin "$GITHUB_BASE_REF"
          git fetch origin --depth=1

          # cspell is fetched on demand by bunx; no full project install needed.
          dev_scripts/cspell-changed-lines.sh "origin/$GITHUB_BASE_REF"
